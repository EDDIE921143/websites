name: Native iOS checks
on:
  push:
    paths: ['ios/**', 'native/**', '.github/workflows/native-ios.yml']
  pull_request:
    paths: ['ios/**', 'native/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Test durable SQLite core
        run: swift test --package-path native/Core
      - name: Select iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > /tmp/ediz-devices.json
          python3 - <<'PY'
          import json, os
          devices=json.load(open('/tmp/ediz-devices.json'))['devices']
          phones=[]
          for runtime,group in devices.items():
              if 'iOS-26-' not in runtime: continue
              version=tuple(int(p) for p in runtime.split('iOS-')[1].split('-'))
              for d in group:
                  if d.get('isAvailable') and d['name'] in ('iPhone 17 Pro','iPhone 16 Pro'): phones.append((version,d['name'],d))
          if not phones: raise SystemExit('No stable iOS 26 Pro iPhone simulator is installed.')
          phones.sort(key=lambda entry:(entry[0],entry[1]),reverse=True)
          phone=phones[0][2]
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('EDIZ_SIM_ID='+phone['udid']+'\n')
          print(phone['name'],phones[0][0])
          PY
      - name: Compile native application and UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/App/App.xcodeproj -scheme App -destination "platform=iOS Simulator,id=$EDIZ_SIM_ID" -derivedDataPath /tmp/ediz-derived CODE_SIGNING_ALLOWED=NO | tee /tmp/ediz-xcode-build.log
      - name: Capture the real empty-state interface
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$EDIZ_SIM_ID" || true
          xcrun simctl bootstatus "$EDIZ_SIM_ID" -b | tee /tmp/ediz-simulator-boot.log
          xcrun simctl ui "$EDIZ_SIM_ID" appearance dark
          xcrun simctl install "$EDIZ_SIM_ID" /tmp/ediz-derived/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$EDIZ_SIM_ID" com.ediz.os
          sleep 2
          xcrun simctl io "$EDIZ_SIM_ID" screenshot /tmp/ediz-native-today.png
      - name: Preserve launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: native-launch-preview
          path: /tmp/ediz-native-today.png
      - name: Test native navigation, capture, persistence and gestures
        run: |
          set -o pipefail
          xcodebuild test-without-building -project ios/App/App.xcodeproj -scheme App -destination "platform=iOS Simulator,id=$EDIZ_SIM_ID" -parallel-testing-enabled NO -derivedDataPath /tmp/ediz-derived -resultBundlePath /tmp/ediz-results.xcresult CODE_SIGNING_ALLOWED=NO | tee /tmp/ediz-xcode.log
      - name: Prepare unsigned iPhone archive
        if: success()
        run: |
          set -o pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath /tmp/ediz-native.xcarchive CODE_SIGNING_ALLOWED=NO | tee /tmp/ediz-device-build.log
          ditto -c -k --sequesterRsrc --keepParent /tmp/ediz-native.xcarchive /tmp/ediz-unsigned-device-archive.zip
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-verification
          path: |
            /tmp/ediz-results.xcresult
            /tmp/ediz-simulator-boot.log
            /tmp/ediz-xcode-build.log
            /tmp/ediz-xcode.log
            /tmp/ediz-native-today.png
            /tmp/ediz-device-build.log
            /tmp/ediz-unsigned-device-archive.zip
